---
layout: page
title: Posts
permalink: /posts/
---

<p>Every project, in order, newest first. Tag filtering comes in stage 2.</p>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%d %B %Y' }}</time>
  </li>
  {% endfor %}
</ul>
