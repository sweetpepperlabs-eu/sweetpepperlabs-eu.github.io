---
layout: page
title: Posts
permalink: /posts/
---

<p>Every post, newest first. Pick a tag to narrow the list.</p>

<nav class="tag-filter" aria-label="Filter posts by tag">
  <a class="tag-chip" href="{{ '/posts/' | relative_url }}">All</a>
  {% for t in site.data.tags %}
  <a class="tag-chip" href="{{ '/posts/?tag=' | append: t | relative_url }}">#{{ t }}</a>
  {% endfor %}
</nav>

<p id="filter-status" role="status" class="filter-status"></p>

<ul class="post-list" id="post-list">
  {% for post in site.posts %}
  <li data-tags=" {{ post.tags | join: ' ' }} ">
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%d %B %Y' }}</time>
  </li>
  {% endfor %}
</ul>

<!-- Optional enhancement: without JS, every post is still listed. -->
<script src="{{ '/assets/js/filter.js' | relative_url }}" defer></script>
