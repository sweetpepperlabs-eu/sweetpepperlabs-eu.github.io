# ---------------------------------------------------------------
# Site settings: sweetpepperlabs.eu
# ---------------------------------------------------------------

# Site title shown in the header and the <title> tag.
title: sweetpepperlabs

# Short description used for the meta description and the header subtitle.
description: "Projects, maps and experiments by [YOUR NAME], published as they happen."

# Author name used for post bylines. Kept as the GitHub username on purpose.
author: lebuu_eu

# Contact address shown on the Contact page and used as the form recipient.
email: w.molina@sweetpepperlabs.eu

# Form endpoint for the Contact page. GitHub Pages cannot send mail by itself,
# so the form posts to a form service (Formspree). Create a form there, set it to
# deliver to the address above, and paste its ID here.
contact_form_endpoint: "https://formspree.io/f/[YOUR-FORM-ID]"

# Full public address, scheme and domain, with no trailing slash.
# Used for absolute links, the feed and the sitemap.
url: "https://www.sweetpepperlabs.eu"

# Path the site lives under.
# User site (custom domain, current setup): leave empty "".
# Project site (https://<user>.github.io/<repo>/): set to "/<repo-name>".
baseurl: ""

# Social profiles. Dummy values for now; the footer shows them as placeholders.
instagram_username: "[INSTAGRAM HANDLE]"
mastodon_url: "https://mastodon.social/@[HANDLE]"
linkedin_username: "[LINKEDIN HANDLE]"

# Markdown engine used for posts and pages.
markdown: kramdown

# Only GitHub Pages-supported plugins are allowed here.
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Posts live in _posts and are sorted newest first by their front matter `date`.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Files that should never be published.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/bundle/
  - node_modules/

# Sass output for the single compiled stylesheet.
sass:
  style: compressed
