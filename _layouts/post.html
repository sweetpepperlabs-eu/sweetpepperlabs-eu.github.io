---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d %B %Y' }}</time>
      {% if page.tags %}· {% for tag in page.tags %}<a class="tag" href="{{ '/posts/?tag=' | append: tag | relative_url }}">#{{ tag }}</a> {% endfor %}{% endif %}
    </p>
  </header>
  {{ content }}
  <p><a href="{{ '/posts/' | relative_url }}">&larr; All posts</a></p>
</article>
