---
layout: default
---
<section class="intro halftone">
  <h1 class="page-title glitch">{{ site.title }}</h1>
  {% if page.accent %}<p class="script-accent">{{ page.accent }}</p>{% endif %}
  <p class="lead">{{ page.intro }}</p>
</section>

{% assign latest = site.posts | slice: 0, 7 %}
<ul class="grid" role="list" aria-label="Latest posts">
  {% for post in latest %}
  {% assign is_new = forloop.first %}
  <li>{% include post-card.html %}</li>
  {% endfor %}
</ul>

<p class="mt-4"><a class="btn-retro" href="{{ '/posts/' | relative_url }}">Browse all posts</a></p>
